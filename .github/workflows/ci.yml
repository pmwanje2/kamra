name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# least privilege: these jobs only read the repo
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run i18n:check
        working-directory: frontend
      - run: npm run languages:check
        working-directory: frontend
      - name: Install Chromium for synthetic browser checks
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Frontend tests (Vitest and Chromium)
        run: npm test
        working-directory: frontend
      - name: UI language fallback rules
        run: python3 -m unittest kamra.tests.test_ui_language_logic
      - name: v2.8.0 carrier and ERP bridge contracts (no site)
        run: python3 -m unittest kamra.tests.test_v280_carrier_contract kamra.tests.test_erp_bridge
      - name: Check white-label source and server messages
        run: |
          npm --prefix frontend run brand:check
          python3 -m unittest kamra.tests.test_white_label
      - name: White-label health API contract (no site)
        run: python3 -m unittest kamra.tests.test_health_white_label
      - name: Check white-label routes and disabled F&B settings
        working-directory: frontend
        run: |
          npm run white-label:routes
          npm run settings:route-check
      - name: Check the white-label health screen
        run: npm run health-redaction:check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Verify production serve base
        # The served SPA must reference its assets under /assets/kamra/frontend/;
        # a wrong base here silently breaks the /kamra install.
        run: grep -q "/assets/kamra/frontend/assets/" kamra/public/frontend/index.html

      - name: Check international phone handling
        run: npm run phone:check
        working-directory: frontend

      - name: Check CSV export quoting and the formula guard
        run: npm run csv:check
        working-directory: frontend

      - name: Check booking default room-type picker
        run: npm run booking-defaults:check
        working-directory: frontend

      - name: Check lock messages after undoing a check-in
        run: npm run key-notice:check
        working-directory: frontend

      - name: Check nightly prices typed on New booking
        run: npm run night-prices:check
        working-directory: frontend

      - name: Check local date formatting
        run: npm run dates:check
        working-directory: frontend

      - name: Check the charge tax default
        run: npm run tax:check
        working-directory: frontend

      - name: Check the late check-out fee rule
        run: npm run late-fee:check
        working-directory: frontend

      - name: Check a date change saves once the new price is confirmed
        run: npm run amend-dates:check
        working-directory: frontend

      - name: Check the agreed rate action on a booking
        run: npm run agreed-rate:check
        working-directory: frontend

      - name: Check the single-booking quotation and its email
        run: |
          npm run booking-quote:check
          node --test scripts/booking-quotation-browser-check.mjs
        working-directory: frontend

      - name: Check the projected ADR / RevPAR on the manager flash
        run: npm run flash-projected:check
        working-directory: frontend

      - name: Check the discount hint offers Advance bill
        run: npm run discount-advance-bill:check
        working-directory: frontend

      - name: Check settlement previews and row corrections
        run: npm run fx-preview:check
        working-directory: frontend

      - name: Check front-office business dates and room labels
        run: npm run front-office:check
        working-directory: frontend

      - name: Check hotel taxonomies come from the masters
        run: npm run configurable-lists:check
        working-directory: frontend

      - name: Check bridged tax invoice VAT rendering
        run: npx vitest run scripts/printed-invoice-vat.test.tsx
        working-directory: frontend

  contract:
    # Fails a PR that breaks what connected apps rely on (MCP tools, REST
    # methods, scopes, webhooks). No bench: the contract is read from source.
    name: Public contract check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Unit tests for the checker
        run: python3 -m unittest scripts/test_contract_check.py
      - name: Compare with the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          python3 docs-site/gen_contract.py --root "$RUNNER_TEMP/base" --out "$RUNNER_TEMP/base.json"
          python3 docs-site/gen_contract.py --keep "$RUNNER_TEMP/base.json" --out "$RUNNER_TEMP/head.json"
          set -o pipefail
          python3 scripts/contract_check.py "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json" \
            --deprecations contract-deprecations.json | tee contract.out
      - name: Summary
        if: always()
        run: |
          [ -f contract.out ] || exit 0
          { echo '### Public contract'; echo '```'; cat contract.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  evals:
    name: Backend eval harness
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          path: apps/kamra

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y redis-server mariadb-client
          sudo service redis-server start
          npm install -g yarn

      - name: Configure MariaDB
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "
            SET GLOBAL character_set_server = 'utf8mb4';
            SET GLOBAL collation_server = 'utf8mb4_unicode_ci';"

      - name: Init bench
        run: |
          pip install frappe-bench
          # pinned to the stable release tag: the version-16 branch tip
          # currently ships an UnboundLocalError in frappe/locale.py
          bench init --skip-redis-config-generation --skip-assets \
            --frappe-branch v16.25.0 frappe-bench
          cd frappe-bench
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache redis://127.0.0.1:6379
          bench set-config -g redis_queue redis://127.0.0.1:6379
          bench set-config -g redis_socketio redis://127.0.0.1:6379

      - name: Install app & site
        run: |
          cd frappe-bench
          bench get-app payments
          bench get-app kamra "${GITHUB_WORKSPACE}/apps/kamra"
          # get-app clones the source; ignored build output must be built in that clone.
          npm --prefix apps/kamra/frontend ci
          npm --prefix apps/kamra/frontend run build
          bench new-site test.localhost \
            --mariadb-user-host-login-scope='%' \
            --db-root-password root --admin-password admin
          bench --site test.localhost install-app kamra
          bench --site test.localhost set-config developer_mode 1

      - name: Run eval harness
        run: |
          cd frappe-bench
          printf 'from kamra.scripts.eval_harness import execute\nexecute()\nexit\n' \
            | bench --site test.localhost console | tee eval.out
          awk '/eval harness: [0-9]+\/[0-9]+ passed/ { split($5, n, "/"); ok = (n[1] == n[2]) } END { exit !ok }' eval.out  # all green, however many checks

      - name: Run the banquet unit tests
        run: |
          cd frappe-bench
          # tee would otherwise mask a runner that dies after printing OK
          set -o pipefail
          bench --site test.localhost set-config allow_tests true
          bench --site test.localhost run-tests --module kamra.tests.test_banquet \
            2>&1 | tee banquet.out
          grep -qE "^OK$" banquet.out
          if grep -qE "^FAILED" banquet.out; then exit 1; fi

      - name: Run the night audit, ledger and scheduled-audit unit tests
        run: |
          cd frappe-bench
          # tee would otherwise mask a runner that dies after printing OK
          set -o pipefail
          for m in test_p2_share_reservations test_p2_share_reservations_r2 test_assistant_currency test_nicaragua_pack test_uganda_pack test_night_audit test_ledger_audit test_folio_leaks test_bill_settlement test_health test_scheduled_jobs test_golive test_credit_control test_webhooks test_pos_interface test_pos_override_pin_and_room_charge test_mcp test_contract_keys test_seed_history test_rates test_night_prices test_night_prices_booking test_holiday_package test_siu_room_type_sync test_booking_options_order test_payment_idempotency test_ui_languages test_agreed_rate test_charge_tax_default test_proforma_projected test_late_checkout_fee test_levy_per_night test_reverse_check_in test_night_audit_schedule test_cashier_tills_off test_folio_closed_target test_central_password_reset test_booking_quotation test_related_pricing_review test_flash_projected test_desk_feedback test_void_keeps_line test_settings_document_events test_payment_correction test_payment_rate_window test_channel_webhook_query_args test_country_defaults test_configurable_masters test_india_defaults_migration test_reservation_discounts test_reservation_discounts_r2 test_reservation_discounts_r3 test_reservation_discounts_r4 test_reservation_discounts_r5 test_reservation_discounts_r6 test_reservation_discounts_merge_v280 test_printed_invoice_vat_and_day_use test_comp_house_use test_comp_house_use_r2 test_fiscal_folio test_banquet_fiscal test_outlet_checks test_erp_books_fence; do
            bench --site test.localhost run-tests --module kamra.tests.$m \
              2>&1 | tee "$m.out"
            # known bugs are pinned as expected failures and a few tests skip
            # by design, so OK may carry those counts
            grep -qE "^OK( \(((expected failures|skipped)=[0-9]+(, )?)+\))?$" "$m.out" || exit 1
            # a module can print one summary per test runner (integration
            # and siteless): any FAILED summary fails it, whatever else is OK
            if grep -qE "^FAILED" "$m.out"; then exit 1; fi
          done

      - name: Run rate matrix follow-up unit tests (no site)
        working-directory: apps/kamra
        run: python3 -m unittest kamra.tests.test_rate_matrix_followup

      - name: Run front-desk persona journey
        run: |
          cd frappe-bench
          printf 'from kamra.scripts.frontdesk_eval import execute\nexecute()\nexit\n' \
            | bench --site test.localhost console | tee journey.out
          grep -q "13/13 passed" journey.out

      - name: Fresh-install correctness (roles bind, SPA serves)
        run: |
          cd frappe-bench
          cat > /tmp/fresh_check.py <<'PY'
          import os, frappe
          roles = ["Front Desk","Housekeeping","Finance","Revenue Manager","Kamra Agent","Hotel Admin"]
          missing = [r for r in roles if not frappe.db.exists("Role", r)]
          assert not missing, f"roles auto-create failed: {missing}"
          assert frappe.get_all("DocPerm", filters={"parent":"Reservation"}), "no Reservation perms bound"
          assert os.path.exists(frappe.get_app_path("kamra","public","frontend","index.html")), "built SPA not shipped"
          assert os.path.exists(frappe.get_app_path("kamra","www","kamra.py")), "SPA boot page missing"
          rules = str(frappe.get_hooks("website_route_rules"))
          assert "/kamra/<path:app_path>" in rules, "/kamra route rule missing"
          print("FRESH-INSTALL CHECKS PASSED")
          PY
          printf 'exec(open("/tmp/fresh_check.py").read())\nexit\n' \
            | bench --site test.localhost console | tee fresh.out
          grep -q "FRESH-INSTALL CHECKS PASSED" fresh.out
